name: Release packages
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Build canonical distributions
        run: python tools/upstream_gpt_byggaren/build_distributions.py --project-root . --version "${GITHUB_REF_NAME#v}" --targets project,chat_zip,plugin
      - name: Validate canonical distributions
        run: python tools/upstream_gpt_byggaren/validate_distributions.py --project-root .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          fail_on_unmatched_files: true
