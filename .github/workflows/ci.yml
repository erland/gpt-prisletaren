name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - name: Canonical GPT Byggaren v1.6.19 lint
        run: python tools/upstream_gpt_byggaren/lint_gpt_project.py --project-root . --json
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py --version 0.5.0 --skip-tests
      - run: python -m unittest tests.test_build_contract -v
      - name: Canonical distribution build
        run: python tools/upstream_gpt_byggaren/build_distributions.py --project-root . --version 0.5.0 --targets chat_zip,plugin,claude_project,claude_skills,opencode
      - name: Canonical distribution validation
        run: python tools/upstream_gpt_byggaren/validate_distributions.py --project-root .
      - name: Verify canonical output contracts
        run: python -m unittest tests.test_canonical_output -v
      - name: Verify all five runtime distribution contracts
        run: python -m unittest tests.test_all_runtimes -v
      - name: Simulate v0.6.0 tag packaging without publishing
        run: python tools/upstream_gpt_byggaren/build_distributions.py --project-root . --version 0.6.0 --targets project,chat_zip,plugin,claude_project,claude_skills,opencode
      - name: Verify release-version archive tests
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: v0.6.0
        run: |
          python -m unittest tests.test_canonical_output tests.test_all_runtimes -v
