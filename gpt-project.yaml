project:
  id: prisletaren
  name: Prisletaren
  description: Identifiera fysiska produkter och jämför verifierbara svenska totalpriser inklusive frakt.
  author: Prisletaren-projektet
  repository: https://github.com/erland/gpt-prisletaren
instructions:
  canonical: src/canonical/instructions.md
structure:
  conversation_starters:
    path: src/conversation-starters
  runtime_policy:
    path: src/runtime-policy
  schemas:
    path: src/schemas
  templates:
    path: src/templates
knowledge_architecture:
  canonical_root: src/knowledge
capabilities:
  requirements:
    web:
      level: required
    code_execution:
      level: optional
workspace_state:
  persistent: false
tools:
  definitions: []
skills:
  definitions:
    - id: prisjamforelse
      name: prisjamforelse
      description: Hitta rätt produktvariant och jämför aktuella totalpriser inklusive frakt i Sverige.
      references:
        - src/canonical/contracts.md
      assets: []
      scripts: []
runtime:
  primary: none
  chat_zip:
    enabled: true
    start_here_template: src/runtime/START-HERE.md
  plugin:
    enabled: true
    interface:
      displayName: Prisletaren
      shortDescription: Jämför priser med frakt
      longDescription: Identifierar produkter och jämför tillgängliga svenska butikserbjudanden med verifierat eller beräknat totalpris inklusive frakt.
      developerName: Prisletaren-projektet
      category: Shopping
      capabilities:
        - Interactive
      defaultPrompt: Hitta bästa verifierbara totalpris inklusive frakt för en produkt i Sverige.
    layout:
      manifest_file: plugin.json
      skills: skills
    templates:
      readme: src/templates/README.plugin.md
  custom_gpt:
    enabled: true
    instruction:
      mode: identical
      max_characters: 8000
    knowledge:
      strategy: prioritize
      max_files: 20
    builder:
      runtime_contract: builder/runtime-contract.json
    templates:
      capabilities: src/templates/custom-capabilities.md
      readme: src/templates/custom-readme.md
      compatibility: src/templates/custom-compatibility.md
  claude:
    enabled: true
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: src/templates/claude-readme.md
  claude_skills:
    enabled: true
  opencode:
    enabled: true
    skills:
      enabled: true
      directory: .opencode/skills
    layout:
      instructions: AGENTS.md
      knowledge: knowledge
      tools: .opencode/tools
      runtime_scripts: scripts
      config: opencode.json
      runtime_contract: runtime-contract.json
    templates:
      readme: src/templates/opencode-readme.md
build_system:
  targets:
    - project
    - chat_zip
    - plugin
    - custom_gpt
    - claude_project
    - claude_skills
    - opencode
  runtime_targets:
    chat_zip:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: "<project-id>-chat-<version>.zip"
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: "<project-id>-plugin-<version>.zip"
    custom_gpt:
      runtime_id: chatgpt_custom
      runtime_key: custom_gpt
      builder: custom_gpt
      artifact_type: custom_gpt_zip
      filename_pattern: "<project-id>-custom-gpt-<version>.zip"
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: "<project-id>-claude-project-<version>.zip"
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude_skills
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: "<project-id>-claude-skills-<version>.zip"
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: "<project-id>-opencode-<version>.zip"
